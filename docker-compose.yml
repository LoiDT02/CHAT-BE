version: "3.9"
services:
  fastapi-app:
    build: .
    container_name: fastapi-app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mongodb
    environment:
      POSTGRES_USER: loi
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: chatdb
      POSTGRES_HOST: postgres
      MONGO_URL: mongodb://loi:123@mongodb:27017/chatdb
    volumes:
      - .:/app

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: loi
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: loi
      MONGO_INITDB_ROOT_PASSWORD: 123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  mongo_data:
  minio_data: